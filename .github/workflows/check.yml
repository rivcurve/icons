name: Check

on:
  push:
    branches: [main, "work/**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Validate icons, generate packages, test them
        run: npm test
      - name: Pack packages
        run: |
          npm pack --dry-run ./packages/icons
          npm pack --dry-run ./packages/react
      - name: Build site
        run: npm run build
